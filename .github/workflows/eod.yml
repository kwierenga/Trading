name: EOD routine

# Captures today's portfolio state, closed trades, turnover, tax drag,
# emails the review, and commits the [EOD] JOURNAL.md entry back to main.
#
# Schedule: 21:15 UTC weekdays.
#   = 17:15 ET (EDT, summer) — runs an hour after market close
#   = 16:15 ET (EST, winter) — ideal, 15 min after market close
# UTC cron does not shift with DST. Leaning late ensures we always run AFTER the
# 16:00 ET market close — running before close would miss today's late closures.

on:
  schedule:
    - cron: '15 21 * * 1-5'
  workflow_dispatch:  # manual fire from Actions tab
    inputs:
      force:
        description: 'Bypass weekday/holiday skip (test fire on weekends)'
        required: false
        default: false
        type: boolean

concurrency:
  group: trading-write  # shared with morning/execute/weekly_review — see morning.yml
  cancel-in-progress: false

# See morning.yml for rationale; remove once Node 24 is bundled by default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  eod:
    runs-on: ubuntu-latest
    environment: paper
    permissions:
      contents: write  # to commit JOURNAL.md back to main
      actions: read    # to read backup-trigger run history (liveness check)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # see morning.yml — get latest main at run time, not trigger time
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EOD routine
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_API_BASE_URL: ${{ secrets.ALPACA_API_BASE_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
        run: python eod_routine.py

      - name: Commit journal updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Housekeeping: clear SKIP_TODAY.flag if dated today or earlier.
          # Future-dated flags are preserved so a planned skip isn't undone.
          if [ -f SKIP_TODAY.flag ]; then
            TODAY=$(date -u +%Y-%m-%d)
            FLAG_DATE=$(tr -d '[:space:]' < SKIP_TODAY.flag)
            if [[ "$FLAG_DATE" < "$TODAY" || "$FLAG_DATE" == "$TODAY" ]]; then
              rm SKIP_TODAY.flag
              git add SKIP_TODAY.flag
              echo "Cleared SKIP_TODAY.flag (was dated $FLAG_DATE)"
            else
              echo "SKIP_TODAY.flag dated $FLAG_DATE — kept (future date)"
            fi
          fi

          git add JOURNAL.md
          # execution_ledger.json: EOD stamps final fill status onto today's
          # rows (enhancement #2), so persist it. Use -- to be safe if absent.
          git add execution_ledger.json 2>/dev/null || true
          # trade_journal.json: the EOD routine reconciles it against Alpaca's
          # fill history every evening, but until 2026-06-11 the corrected file
          # was thrown away with the runner — the repo copy (which feeds the AM
          # prompt's win-rate stats and post-mortems) stayed permanently stale.
          git add trade_journal.json 2>/dev/null || true
          # trade_post_mortems.md: per-closed-trade mechanical blocks appended
          # at EOD; Klaas fills the reflective fields async (training loop).
          git add trade_post_mortems.md 2>/dev/null || true
          # portfolio_history.json + daily_report.json: the EOD routine appends a
          # daily equity snapshot to each, but until 2026-06-14 neither was staged
          # — so the runner threw them away and the committed history froze at 5
          # snapshots from 2026-05-01. That silently starved portfolio_metrics.py
          # (Sortino/max-drawdown) and the weekly quantstats tear-sheet of data.
          # Same class of bug as the trade_journal.json fix above.
          git add portfolio_history.json 2>/dev/null || true
          git add daily_report.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No staged changes (likely a US holiday with no flag to clear)."
          else
            git commit -m "[EOD] EOD routine $(date -u +'%Y-%m-%d')"
            for attempt in 1 2 3; do
              if git push; then echo "Pushed on attempt $attempt"; exit 0; fi
              echo "Push attempt $attempt failed; rebasing on origin/main and retrying..."
              git pull --rebase origin main
            done
            echo "Push failed after 3 attempts."
            exit 1
          fi

      # Backup-trigger liveness check — turns a silent cron-job.org PAT expiry
      # into a loud alert email. Best-effort: check_backup_liveness.py always
      # exits 0, so it can never fail the EOD job. Runs even if an earlier step
      # failed so a dead backup is still caught.
      - name: Check backup-trigger liveness
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python check_backup_liveness.py

      # Dead-man's-switch heartbeat — confirms the EOD cron fired. No-op until
      # the HEALTHCHECK_UUID_EOD secret is set.
      - name: Heartbeat (healthchecks.io)
        if: ${{ success() && env.HC_UUID != '' }}
        env:
          HC_UUID: ${{ secrets.HEALTHCHECK_UUID_EOD }}
        run: curl -fsS -m 10 --retry 3 "https://hc-ping.com/${HC_UUID}" || true
