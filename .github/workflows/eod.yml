name: EOD routine

# Captures today's portfolio state, closed trades, turnover, tax drag,
# emails the review, and commits the [EOD] JOURNAL.md entry back to main.
#
# Schedule: 21:15 UTC weekdays.
#   = 17:15 ET (EDT, summer) — runs an hour after market close
#   = 16:15 ET (EST, winter) — ideal, 15 min after market close
# UTC cron does not shift with DST. Leaning late ensures we always run AFTER the
# 16:00 ET market close — running before close would miss today's late closures.

on:
  schedule:
    - cron: '15 21 * * 1-5'
  workflow_dispatch:  # manual fire from Actions tab
    inputs:
      force:
        description: 'Bypass weekday/holiday skip (test fire on weekends)'
        required: false
        default: false
        type: boolean

concurrency:
  group: trading-write  # shared with morning/execute/weekly_review — see morning.yml
  cancel-in-progress: false

# See morning.yml for rationale; remove once Node 24 is bundled by default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  eod:
    runs-on: ubuntu-latest
    environment: paper
    permissions:
      contents: write  # to commit JOURNAL.md back to main

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # see morning.yml — get latest main at run time, not trigger time
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EOD routine
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_API_BASE_URL: ${{ secrets.ALPACA_API_BASE_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
        run: python eod_routine.py

      - name: Commit journal updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Housekeeping: clear SKIP_TODAY.flag if dated today or earlier.
          # Future-dated flags are preserved so a planned skip isn't undone.
          if [ -f SKIP_TODAY.flag ]; then
            TODAY=$(date -u +%Y-%m-%d)
            FLAG_DATE=$(tr -d '[:space:]' < SKIP_TODAY.flag)
            if [[ "$FLAG_DATE" < "$TODAY" || "$FLAG_DATE" == "$TODAY" ]]; then
              rm SKIP_TODAY.flag
              git add SKIP_TODAY.flag
              echo "Cleared SKIP_TODAY.flag (was dated $FLAG_DATE)"
            else
              echo "SKIP_TODAY.flag dated $FLAG_DATE — kept (future date)"
            fi
          fi

          git add JOURNAL.md
          if git diff --cached --quiet; then
            echo "No staged changes (likely a US holiday with no flag to clear)."
          else
            git commit -m "[EOD] EOD routine $(date -u +'%Y-%m-%d')"
            for attempt in 1 2 3; do
              if git push; then echo "Pushed on attempt $attempt"; exit 0; fi
              echo "Push attempt $attempt failed; rebasing on origin/main and retrying..."
              git pull --rebase origin main
            done
            echo "Push failed after 3 attempts."
            exit 1
          fi
