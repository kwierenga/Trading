name: Cancel stale execute approvals

# At 09:30 ET, cancels any Execute strategy run that's still waiting on the
# paper-execute Required Reviewers gate. Rationale: if Klaas didn't approve by
# market open, he's not approving today — close the loop so the run doesn't
# sit in the queue indefinitely (or fire orders late, after market drift).
#
# Schedule: 13:30 UTC = 09:30 EDT (summer) / 08:30 EST (winter).
# In winter the cancel fires an hour BEFORE market open. That's fine — execute
# would still be waiting for approval, and cancelling pre-open just means
# Klaas's ~07:00 ET approval window becomes 90 minutes instead of 2.5 hours.
# An acceptable seasonal asymmetry; UTC cron simplicity wins.

on:
  schedule:
    - cron: '30 13 * * 1-5'
  workflow_dispatch:  # manual fire, e.g. to clean up test runs

jobs:
  cancel:
    runs-on: ubuntu-latest
    permissions:
      actions: write  # gh run cancel

    steps:
      - name: Cancel waiting Execute runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STALE=$(gh run list --workflow=execute.yml --limit=10 \
            --json databaseId,status,createdAt --jq \
            '.[] | select(.status == "waiting" or .status == "queued") | .databaseId')
          if [ -z "$STALE" ]; then
            echo "No stale execute runs to cancel."
            exit 0
          fi
          for id in $STALE; do
            echo "Cancelling stale execute run $id..."
            gh run cancel "$id" --repo "${{ github.repository }}" || echo "  (already finished?)"
          done
