name: Morning routine

# Runs the S&P 500 screen, asks Claude for trades, commits the plan, and emails
# Klaas a single combined plan + tap-to-run link.
#
# Schedule: 10:00 UTC weekdays.
#   = 06:00 ET (EDT, summer) — ideal
#   = 05:00 ET (EST, winter) — runs an hour early; better than running an hour late.
# UTC cron does not shift with DST.
#
# Phase 2 design (2026-05-04): morning.yml does NOT auto-dispatch execute.yml.
# Instead, the email contains a link to the execute.yml workflow_dispatch page,
# which Klaas opens in the GitHub mobile app and taps "Run Workflow" — the only
# environment-gate primitive that actually works in the iOS app.
# Safety: execute.yml has a freshness check (latest_strategy.json must be <6h
# old) so a stale plan can't be re-run later.

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass weekday/holiday skip (test fire on weekends)'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    # Backup trigger fired by external cron (cron-job.org) at ~10:20 UTC.
    # Belt-and-suspenders for GitHub Actions hosted-runner cron drops/delays —
    # 2026-06-15 the scheduled morning cron fired ~5h41m late, so no fresh plan
    # existed when execute.yml's punctual backup ran and it refused on staleness.
    # The execute.yml backup only protected the execute step; this closes the
    # equivalent gap upstream. Idempotency check below skips if today's [AM]
    # commit already exists, so it's a no-op on successful primary-cron days.
    types: [morning-routine]

# Serialize across ALL trading workflows that write to main.
concurrency:
  group: trading-write
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  morning:
    runs-on: ubuntu-latest
    environment: paper
    permissions:
      contents: write  # commit latest_strategy.json + JOURNAL.md

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # need history for the same-day [AM] idempotency grep

      - name: Show deployed commit
        run: |
          echo "Deployed commit: ${{ github.sha }}"
          git log -1 --oneline

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine if we should run (same-day idempotency for backup trigger)
        # The cron-job.org backup (repository_dispatch) fires ~10:20 UTC even on
        # days the primary 10:00 cron already ran. Skip cleanly if today's [AM]
        # commit already exists so we don't re-screen, double-commit, and double-
        # email. workflow_dispatch with force=true bypasses (deliberate re-run/test).
        # Holiday/weekend skipping is handled inside morning_routine.py itself.
        id: shouldrun
        run: |
          SHOULD_RUN=true
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "force=true — bypassing same-day idempotency check"
          else
            TODAY=$(date -u +%Y-%m-%d)
            if git log --oneline --grep="^\[AM\] Morning routine ${TODAY}" -1 | grep -q .; then
              SHOULD_RUN=false
              echo "::notice::Skipping morning today: [AM] commit for ${TODAY} already exists (idempotency)"
            fi
          fi
          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT
          if [ "$SHOULD_RUN" = "true" ]; then
            echo "Proceeding with morning (event=${{ github.event_name }})"
          fi

      - name: Plan phase — screen + Claude + journal (no email yet)
        if: ${{ steps.shouldrun.outputs.should_run == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_API_BASE_URL: ${{ secrets.ALPACA_API_BASE_URL }}
          # Email creds passed in case strategy-generation fails — that path
          # sends an immediate failure email even in plan phase.
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
          PHASE: plan
        run: python morning_routine.py

      - name: Commit strategy + journal updates
        if: ${{ steps.shouldrun.outputs.should_run == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_strategy.json JOURNAL.md
          if git diff --cached --quiet; then
            echo "No changes to commit (likely a US holiday or screen produced nothing)."
          else
            git commit -m "[AM] Morning routine $(date -u +'%Y-%m-%d')"
            for attempt in 1 2 3; do
              if git push; then echo "Pushed on attempt $attempt"; break; fi
              echo "Push attempt $attempt failed; rebasing on origin/main and retrying..."
              git pull --rebase origin main
            done
          fi

      - name: Email phase — send plan + run-workflow link
        if: ${{ steps.shouldrun.outputs.should_run == 'true' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_API_BASE_URL: ${{ secrets.ALPACA_API_BASE_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
          PHASE: email
        run: python morning_routine.py

      # Dead-man's-switch heartbeat: pings healthchecks.io on success. If a
      # scheduled run is dropped entirely (GitHub cron outage), no ping arrives
      # and healthchecks.io alerts after the grace period — the one failure mode
      # the in-workflow freshness/failure emails can't catch (a run that never
      # happens sends no email). No-op until HEALTHCHECK_UUID_MORNING secret is set.
      - name: Heartbeat (healthchecks.io)
        if: ${{ env.HC_UUID != '' }}
        env:
          HC_UUID: ${{ secrets.HEALTHCHECK_UUID_MORNING }}
        run: curl -fsS -m 10 --retry 3 "https://hc-ping.com/${HC_UUID}" || true
