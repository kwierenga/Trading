name: Morning routine

# Runs the S&P 500 screen, asks Claude for trades, dispatches execute.yml
# (which pauses on the paper-execute approval gate), and emails Klaas a single
# combined plan + tap-to-approve link.
#
# Schedule: 10:00 UTC weekdays.
#   = 06:00 ET (EDT, summer) — ideal
#   = 05:00 ET (EST, winter) — runs an hour early; better than running an hour late.
# UTC cron does not shift with DST.
#
# Step ordering (important — see morning_routine.py PHASE docstring):
#   1. plan phase  — write latest_strategy.json + JOURNAL [AM] entry
#   2. commit JSON+journal to main
#   3. dispatch execute.yml + capture the URL of the resulting waiting run
#   4. email phase — send ONE email containing the plan AND the approve URL
# The split exists so the email contains the exact tap-to-approve link.

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:  # manual fire from Actions tab
    inputs:
      force:
        description: 'Bypass weekday/holiday skip (test fire on weekends)'
        required: false
        default: false
        type: boolean
      test_mode:
        description: 'Test mode: dispatch execute with --dry-run + skip wait-for-open'
        required: false
        default: false
        type: boolean

# Serialize across ALL trading workflows that write to main (morning/eod/execute/weekly_review).
concurrency:
  group: trading-write
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  morning:
    runs-on: ubuntu-latest
    environment: paper
    permissions:
      contents: write  # commit latest_strategy.json + JOURNAL.md
      actions: write   # gh workflow run execute.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Plan phase — screen + Claude + journal (no email yet)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_API_BASE_URL: ${{ secrets.ALPACA_API_BASE_URL }}
          # Email creds passed in case strategy-generation fails — that path
          # sends an immediate failure email even in plan phase.
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
          PHASE: plan
        run: python morning_routine.py

      - name: Commit strategy + journal updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_strategy.json JOURNAL.md
          if git diff --cached --quiet; then
            echo "No changes to commit (likely a US holiday or screen produced nothing)."
          else
            git commit -m "[AM] Morning routine $(date -u +'%Y-%m-%d')"
            for attempt in 1 2 3; do
              if git push; then echo "Pushed on attempt $attempt"; break; fi
              echo "Push attempt $attempt failed; rebasing on origin/main and retrying..."
              git pull --rebase origin main
            done
          fi

      - name: Dispatch execute.yml + capture waiting run URL
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: |
          # If the screen produced no trades, latest_strategy.json has trades=[].
          # In that case, don't bother dispatching execute — there's nothing to do.
          TRADE_COUNT=$(python -c "import json; print(len(json.load(open('latest_strategy.json')).get('trades', [])))" 2>/dev/null || echo 0)
          if [ "$TRADE_COUNT" = "0" ]; then
            echo "No trades in plan — skipping execute dispatch."
            echo "approve_url=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Dispatching execute.yml (test_mode=$TEST_MODE)..."
          gh workflow run execute.yml -f test_mode=$TEST_MODE -r main

          # Poll briefly for the just-created run to register, then capture its URL
          APPROVE_URL=""
          for attempt in 1 2 3 4 5 6; do
            sleep 4
            APPROVE_URL=$(gh run list --workflow=execute.yml --limit=3 \
              --json url,status,createdAt --jq \
              '[.[] | select(.status == "waiting" or .status == "queued" or .status == "in_progress")] | sort_by(.createdAt) | last | .url // empty')
            if [ -n "$APPROVE_URL" ]; then
              echo "Captured execute run URL: $APPROVE_URL"
              break
            fi
            echo "  attempt $attempt: run not yet visible, retrying..."
          done

          if [ -z "$APPROVE_URL" ]; then
            echo "Could not capture execute run URL after 6 attempts — email will use generic actions link."
          fi
          echo "approve_url=$APPROVE_URL" >> $GITHUB_OUTPUT

      - name: Email phase — send plan + approve link
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_API_BASE_URL: ${{ secrets.ALPACA_API_BASE_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
          PHASE: email
          APPROVE_URL: ${{ steps.dispatch.outputs.approve_url }}
        run: python morning_routine.py
