name: Execute strategy

# Phase 3 design (2026-05-06): cron-scheduled at 09:35 EST / 10:35 EDT. No
# more email tap, no more in-workflow wait step. morning.yml generates the
# plan independently; this workflow fires on its own schedule and reads
# whatever plan morning.yml committed today. Freshness check (≤6h) is the
# safety net for missed-cron days — it refuses stale plans and the failure
# email surfaces it immediately.
#
# Phase 2 (2026-05-04, retired): tapped from AM email → workflow_dispatch →
# in-workflow sleep until 09:35 ET → submit. Failed in two ways that drove
# Phase 3: (1) GitHub Actions runner queue stalled 7h on 2026-05-05;
# (2) timeout-minutes=90 < the ~2.5h sleep step, killing the workflow before
# submit on 2026-05-06.
#
# Safety story unchanged: (a) freshness check rejects stale plans, (b) RTH
# window check refuses out-of-hours, (c) Claude re-evaluation can refuse any/
# all trades, (d) per-trade concentration cap + ATR sizing apply, (e)
# success/failure emails make every outcome visible within seconds.

on:
  schedule:
    # 14:35 UTC = 09:35 EST (winter, ideal: 5min after open)
    #            = 10:35 EDT (summer, 1h after open: tighter spreads, more intraday data)
    - cron: '35 14 * * 1-5'
  workflow_dispatch:
    # Manual escape hatch for missed-cron days or testing.
    inputs:
      test_mode:
        description: 'Test mode: skip freshness check + force --dry-run'
        required: false
        default: 'false'
        type: string
  repository_dispatch:
    # Backup trigger fired by external cron (cron-job.org) at ~14:50 UTC.
    # Belt-and-suspenders for GitHub Actions hosted-runner cron drops.
    # Idempotency check below skips if today's [EXEC] commit already exists.
    types: [execute-strategy]

concurrency:
  group: trading-write
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  execute:
    runs-on: ubuntu-latest
    environment: paper  # all secrets we need (Alpaca + Anthropic) live here
    permissions:
      contents: write  # commit trade_journal.json updates
    # 25 minutes is enough for: queue contention behind a still-running morning.yml
    # (~6min typical), Anthropic re-evaluation call (~30s), Alpaca submits (~10s
    # per trade), and journal commit. Was 90min in Phase 2 to accommodate the
    # in-workflow sleep, which Phase 3 eliminates.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # need full history for `git log` freshness check

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine if we should run today
        # Combined gate: NYSE trading day + SKIP_TODAY.flag + idempotency.
        # Sets steps.shouldrun.outputs.should_run = 'true' or 'false'. Downstream
        # steps gate on this output and skip cleanly when false (no failure email).
        # test_mode bypasses all checks so manual test dispatches always proceed.
        id: shouldrun
        run: |
          SHOULD_RUN=true
          REASON=""

          if [ "${{ inputs.test_mode }}" = "true" ]; then
            echo "test_mode=true — bypassing all skip checks"
          else
            # 1. NYSE trading-day check (skip US market holidays)
            if ! python market_calendar.py; then
              SHOULD_RUN=false
              REASON="not a NYSE trading day"
            fi

            # 2. SKIP_TODAY.flag check (single-day opt-out)
            if [ -f SKIP_TODAY.flag ] && grep -q "$(date -u +%Y-%m-%d)" SKIP_TODAY.flag; then
              SHOULD_RUN=false
              REASON="SKIP_TODAY.flag matches today's UTC date"
            fi

            # 3. Idempotency — skip if today's [EXEC] commit already exists.
            #    Only applies to schedule + repository_dispatch (backup trigger);
            #    workflow_dispatch is intentional manual and should not be blocked
            #    by an earlier same-day commit.
            if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              TODAY=$(date -u +%Y-%m-%d)
              if git log --oneline --grep="^\[EXEC\] Execute strategy ${TODAY}" -1 | grep -q .; then
                SHOULD_RUN=false
                REASON="[EXEC] commit for ${TODAY} already exists (idempotency vs backup trigger)"
              fi
            fi
          fi

          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT
          if [ "$SHOULD_RUN" = "false" ]; then
            echo "::notice::Skipping execute today: $REASON"
          else
            echo "Proceeding with execute (event=${{ github.event_name }})"
          fi

      - name: Freshness check — refuse stale plans (>6h old)
        if: ${{ steps.shouldrun.outputs.should_run == 'true' && inputs.test_mode != 'true' }}
        run: |
          if [ ! -f latest_strategy.json ]; then
            echo "ERROR: latest_strategy.json missing — run morning.yml first."
            exit 1
          fi
          COMMIT_EPOCH=$(git log -1 --format=%ct latest_strategy.json)
          NOW_EPOCH=$(date +%s)
          AGE_S=$(( NOW_EPOCH - COMMIT_EPOCH ))
          AGE_H=$(( AGE_S / 3600 ))
          if [ $AGE_S -gt 21600 ]; then
            echo "ERROR: latest_strategy.json was committed ${AGE_H}h ago (>6h limit)."
            echo "Refusing to execute on a stale plan. Run morning.yml first."
            exit 1
          fi
          echo "latest_strategy.json was committed $((AGE_S / 60))m ago — fresh, proceeding."

      - name: Verify RTH dispatch window
        # Refuses dispatches outside the safe Regular Trading Hours window.
        # Without this check, a late-night manual dispatch (e.g. for testing)
        # silently submits GTC bracket orders that queue for the NEXT day's
        # open at stale limit prices — exactly what happened on 2026-05-04
        # 21:24 ET when this workflow auto-fired live and 3 orders went out.
        # Allowed window: 04:00 ET through 15:30 ET (leaves 30min margin before
        # close so fills have time). Phase 3's cron fires at 14:35 UTC = 09:35
        # EST winter / 10:35 EDT summer, both inside the window. The 04:00 ET
        # lower bound is for manual workflow_dispatch on missed-cron days.
        if: ${{ steps.shouldrun.outputs.should_run == 'true' && inputs.test_mode != 'true' }}
        run: |
          DOW=$(TZ=America/New_York date +%u)  # 1=Mon, 7=Sun
          if [ $DOW -gt 5 ]; then
            echo "ERROR: today is a weekend (DOW=$DOW). Bracket orders only fill RTH."
            echo "Re-dispatch on a weekday morning."
            exit 1
          fi
          HOUR_NY=$(TZ=America/New_York date +%H)
          MIN_NY=$(TZ=America/New_York date +%M)
          NOW_MIN_OF_DAY=$((10#$HOUR_NY * 60 + 10#$MIN_NY))
          if [ $NOW_MIN_OF_DAY -lt 240 ] || [ $NOW_MIN_OF_DAY -gt 930 ]; then
            CLOCK=$(TZ=America/New_York date +%H:%M)
            echo "ERROR: now is $CLOCK ET — outside the safe RTH dispatch window (04:00-15:30 ET)."
            echo "Bracket orders submitted now would either queue overnight on stale prices,"
            echo "or hit close before fills. Re-dispatch tomorrow morning."
            exit 1
          fi
          echo "RTH window check passed: $(TZ=America/New_York date +%H:%M) ET on weekday."

      - name: Show AM strategy that will be re-evaluated
        if: ${{ steps.shouldrun.outputs.should_run == 'true' }}
        run: |
          echo "=== latest_strategy.json (AM plan, before re-evaluation) ==="
          cat latest_strategy.json | python -m json.tool

      - name: Re-evaluate strategy with current prices
        if: ${{ steps.shouldrun.outputs.should_run == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # CLAUDE_MODEL intentionally not set — re_evaluate.py uses the
          # claude-sonnet-4-6 default. Setting it via a non-existent secret
          # resolves to empty string, which the SDK rejects with a 400.
        run: python re_evaluate.py

      - name: Show post-open strategy that will execute
        if: ${{ steps.shouldrun.outputs.should_run == 'true' }}
        run: |
          echo "=== latest_strategy_postopen.json (after Claude re-evaluation) ==="
          cat latest_strategy_postopen.json | python -m json.tool

      - name: Execute (live or dry-run depending on test_mode)
        if: ${{ steps.shouldrun.outputs.should_run == 'true' }}
        id: execute
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_API_BASE_URL: ${{ secrets.ALPACA_API_BASE_URL }}
        run: |
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            echo "TEST MODE — running with --dry-run (no orders will be submitted)"
            python execute_strategy.py --strategy latest_strategy_postopen.json --dry-run
          else
            python execute_strategy.py --strategy latest_strategy_postopen.json --yes
          fi

      - name: Commit trade journal updates
        # Run if execute step ran (success or failure), but skip on should_run=false
        # days (no journal changes possible). always() alone would try to commit
        # on holiday-skipped days, which is harmless but noisy.
        if: ${{ always() && steps.shouldrun.outputs.should_run == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_journal.json
          if git diff --cached --quiet; then
            echo "No journal changes (no orders placed, all skipped, or dry-run)."
          else
            git commit -m "[EXEC] Execute strategy $(date -u +'%Y-%m-%d')"
            for attempt in 1 2 3; do
              if git push; then echo "Pushed on attempt $attempt"; exit 0; fi
              echo "Push attempt $attempt failed; rebasing on origin/main and retrying..."
              git pull --rebase origin main
            done
            echo "Push failed after 3 attempts."
            exit 1
          fi

      - name: Success email — orders submitted (or 0-trade confirmation)
        # Fires only when Execute completed without error AND we're not in test mode.
        # The notification reads trade_journal.json, summarises today's new entries,
        # and emails Klaas. If 0 entries, the email confirms the workflow ran but
        # all trades got skipped (re-evaluation rejected them, or strategy was cash).
        if: ${{ steps.execute.conclusion == 'success' && inputs.test_mode != 'true' }}
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python notify_execute.py \
            --mode success \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Failure email — workflow failed before orders submitted
        # Fires on any step failure. Phase 3 removes the queue-delay check, so
        # there's no longer a queue-delay-was-the-cause exclusion to worry about.
        # If anything breaks (freshness on missed-cron day, RTH, re-evaluation,
        # Alpaca submit), Klaas finds out within seconds.
        if: ${{ failure() }}
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python notify_execute.py \
            --mode failure \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --failed-step "(see run URL — exact step in the timeline)"
